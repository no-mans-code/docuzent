[package]
name = "docuzent-doc"
version = "0.2.0"
edition = "2021"
description = "Documents: text extraction (txt/md/epub/html/pdf; Docling for scans), a clean title, parts sized for one context, and the pool that swaps each part's saved KV state in and out."

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }
docuzent-llm = { path = "../docuzent-llm" }
docuzent-kv = { path = "../docuzent-kv" }

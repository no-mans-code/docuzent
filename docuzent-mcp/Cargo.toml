[package]
name = "docuzent-mcp"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "docuzent-mcp"
path = "src/main.rs"

[dependencies]
docuzent-core = { path = "../docuzent-core" }
kvcache = { git = "https://github.com/no-mans-code/kvcache" }
rmcp = { version = "3.5", features = ["server", "macros", "transport-io", "schemars"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1.0"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "std", "fmt"] }

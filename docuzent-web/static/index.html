<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>docuzent — learn a document quickly</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --border: #2a2e37;
    --text: #e6e8eb;
    --muted: #8b90a0;
    --accent: #5b8cff;
    --accent-text: #0b0d10;
    --error: #ff6b6b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    justify-content: center;
    padding: 32px 16px;
  }
  main {
    width: 100%;
    max-width: 720px;
  }
  h1 {
    font-size: 1.4rem;
    margin: 0 0 4px;
  }
  .subtitle {
    color: var(--muted);
    margin: 0 0 24px;
    font-size: 0.95rem;
  }
  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 20px;
  }
  .row {
    display: flex;
    gap: 8px;
    align-items: center;
  }
  input[type="file"] {
    color: var(--text);
    flex: 1;
  }
  input[type="text"] {
    flex: 1;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    color: var(--text);
    font-size: 0.95rem;
  }
  select {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    color: var(--text);
    font-size: 0.95rem;
  }
  input[type="text"]:focus, input[type="file"]:focus, select:focus {
    outline: 2px solid var(--accent);
  }
  label {
    font-size: 0.8rem;
    color: var(--muted);
    display: block;
    margin-bottom: 4px;
  }
  .field {
    flex: 1;
  }
  button {
    background: var(--accent);
    color: var(--accent-text);
    border: none;
    border-radius: 8px;
    padding: 10px 16px;
    font-weight: 600;
    cursor: pointer;
    font-size: 0.9rem;
  }
  button:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }
  button:hover:not(:disabled) { filter: brightness(1.1); }
  .status {
    margin-top: 12px;
    font-size: 0.88rem;
    color: var(--muted);
    min-height: 1.2em;
  }
  .status.error { color: var(--error); }
  .spinner {
    display: inline-block;
    width: 12px;
    height: 12px;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    margin-right: 6px;
    vertical-align: -1px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #qaSection { display: none; }
  .transcript {
    display: flex;
    flex-direction: column;
    gap: 16px;
    margin-top: 16px;
  }
  .turn {
    border-left: 3px solid var(--accent);
    padding-left: 12px;
  }
  .question {
    color: var(--muted);
    font-size: 0.85rem;
    margin-bottom: 4px;
  }
  .answer {
    white-space: pre-wrap;
    line-height: 1.45;
  }
  .meta {
    color: var(--muted);
    font-size: 0.78rem;
    margin-top: 6px;
  }
  footer {
    color: var(--muted);
    font-size: 0.78rem;
    text-align: center;
    margin-top: 8px;
  }
</style>
</head>
<body>
<main>
  <h1>docuzent</h1>
  <p class="subtitle">Learn documents quickly — upload one or more files (or .zips of them), loaded together as one corpus, then ask anything.</p>

  <section class="panel">
    <div class="row">
      <div class="field">
        <label for="modelSelect">Model</label>
        <select id="modelSelect"></select>
      </div>
      <div class="field">
        <label for="modeSelect">Cache mode</label>
        <select id="modeSelect">
          <option value="adaptive">adaptive — predict swap vs. raw</option>
          <option value="swap">swap — always reuse cached context</option>
          <option value="raw">raw — never reuse, always cold</option>
        </select>
      </div>
      <div class="field" style="flex: 0;">
        <label>&nbsp;</label>
        <button id="switchBtn">Apply</button>
      </div>
    </div>
    <div class="status" id="switchStatus"></div>
  </section>

  <section class="panel">
    <div class="row">
      <input type="file" id="fileInput" accept="*/*" multiple>
      <button id="loadBtn">Load document(s)</button>
    </div>
    <div class="status" id="loadStatus"></div>
  </section>

  <section class="panel" id="qaSection">
    <div class="row">
      <input type="text" id="questionInput" placeholder="Ask a question about this document…">
      <button id="askBtn">Ask</button>
    </div>
    <div class="status" id="askStatus"></div>
    <div class="transcript" id="transcript"></div>
  </section>

  <footer id="modelInfo"></footer>
</main>

<script>
const loadBtn = document.getElementById('loadBtn');
const fileInput = document.getElementById('fileInput');
const loadStatus = document.getElementById('loadStatus');
const qaSection = document.getElementById('qaSection');
const questionInput = document.getElementById('questionInput');
const askBtn = document.getElementById('askBtn');
const askStatus = document.getElementById('askStatus');
const transcript = document.getElementById('transcript');
const modelInfo = document.getElementById('modelInfo');
const modelSelect = document.getElementById('modelSelect');
const modeSelect = document.getElementById('modeSelect');
const switchBtn = document.getElementById('switchBtn');
const switchStatus = document.getElementById('switchStatus');

function setStatus(el, text, isError) {
  el.textContent = text;
  el.classList.toggle('error', !!isError);
}

async function loadDocument() {
  const files = Array.from(fileInput.files);
  if (files.length === 0) {
    setStatus(loadStatus, 'Choose at least one file first.', true);
    return;
  }
  loadBtn.disabled = true;
  setStatus(loadStatus, '', false);
  loadStatus.innerHTML = `<span class="spinner"></span>Parsing ${files.length} file(s) via Docling — this can take a while for large PDFs…`;

  const form = new FormData();
  for (const file of files) {
    form.append('file', file, file.name);
  }

  try {
    const resp = await fetch('/load', { method: 'POST', body: form });
    const data = await resp.json();
    if (!data.ok) {
      setStatus(loadStatus, data.error || 'Failed to load document.', true);
      return;
    }
    setStatus(
      loadStatus,
      `Loaded ${files.length} file(s), ${data.chars.toLocaleString()} chars — ${data.fits_in_one_chunk ? 'fits in one chunk' : 'will use map-reduce'} — ${data.warm_from_disk ? 'a cached context is available on disk' : 'cold, not seen before'}`,
      false
    );
    qaSection.style.display = 'block';
    transcript.innerHTML = '';
    questionInput.focus();
  } catch (e) {
    setStatus(loadStatus, 'Request failed: ' + e, true);
  } finally {
    loadBtn.disabled = false;
  }
}

async function askQuestion() {
  const question = questionInput.value.trim();
  if (!question) return;
  askBtn.disabled = true;
  questionInput.disabled = true;
  setStatus(askStatus, '', false);
  askStatus.innerHTML = '<span class="spinner"></span>Thinking…';

  try {
    const resp = await fetch('/ask', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ question }),
    });
    const data = await resp.json();
    if (!data.ok) {
      setStatus(askStatus, data.error || 'Failed to answer.', true);
      return;
    }
    setStatus(askStatus, '', false);
    const turn = document.createElement('div');
    turn.className = 'turn';
    const metaBits = data.timings.map(t => `${t.label}: ${t.prompt_eval_duration_ms.toFixed(0)}ms/${t.prompt_eval_count}tok`).join(', ');
    const modeBit = data.used_map_reduce ? `map-reduce over ${data.chunks_mapped} chunks` : 'single chunk';
    const adaptiveBit = data.adaptive_decision
      ? ` — adaptive: predicted swap ${data.adaptive_decision.predicted_swap_ms.toFixed(0)}ms vs raw ${data.adaptive_decision.predicted_raw_ms.toFixed(0)}ms, chose ${data.adaptive_decision.chose_swap ? 'swap' : 'raw'}`
      : '';
    turn.innerHTML = `
      <div class="question">${escapeHtml(question)}</div>
      <div class="answer">${escapeHtml(data.answer)}</div>
      <div class="meta">${modeBit} — ${metaBits}${adaptiveBit}</div>
    `;
    transcript.prepend(turn);
    questionInput.value = '';
  } catch (e) {
    setStatus(askStatus, 'Request failed: ' + e, true);
  } finally {
    askBtn.disabled = false;
    questionInput.disabled = false;
    questionInput.focus();
  }
}

function escapeHtml(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

async function refreshModelInfo() {
  try {
    const resp = await fetch('/model-info');
    const d = await resp.json();
    if (!d.ok) {
      modelInfo.textContent = d.error || 'model info unavailable';
      return;
    }
    modelInfo.textContent = `model: ${d.model} · mode: ${d.mode} · context window: ${d.context_length.toLocaleString()} tokens · cache: ${d.cache_path}`;
    modelSelect.value = d.model;
    modeSelect.value = d.mode;
  } catch (e) {
    modelInfo.textContent = 'model info unavailable: ' + e;
  }
}

async function loadModelList() {
  try {
    const resp = await fetch('/models');
    const data = await resp.json();
    if (!data.ok) {
      setStatus(switchStatus, data.error || 'Failed to list models.', true);
      return;
    }
    modelSelect.innerHTML = '';
    for (const name of data.models) {
      const opt = document.createElement('option');
      opt.value = name;
      opt.textContent = name;
      modelSelect.appendChild(opt);
    }
  } catch (e) {
    setStatus(switchStatus, 'Request failed: ' + e, true);
  }
}

async function switchModel() {
  const model = modelSelect.value;
  const mode = modeSelect.value;
  if (!model) {
    setStatus(switchStatus, 'Choose a model first.', true);
    return;
  }
  switchBtn.disabled = true;
  switchStatus.innerHTML = '<span class="spinner"></span>Switching…';
  try {
    const resp = await fetch('/model', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ model, mode }),
    });
    const data = await resp.json();
    if (!data.ok) {
      setStatus(switchStatus, data.error || 'Failed to switch.', true);
      return;
    }
    setStatus(switchStatus, `Now using ${data.model} (${data.mode}, ${data.context_length.toLocaleString()} tokens). Load your document(s) again.`, false);
    // Switching models replaces the session - whatever was loaded before
    // is gone, so hide the Q&A section until something is loaded again.
    qaSection.style.display = 'none';
    transcript.innerHTML = '';
    await refreshModelInfo();
  } catch (e) {
    setStatus(switchStatus, 'Request failed: ' + e, true);
  } finally {
    switchBtn.disabled = false;
  }
}

loadBtn.addEventListener('click', loadDocument);
askBtn.addEventListener('click', askQuestion);
switchBtn.addEventListener('click', switchModel);
questionInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') askQuestion(); });

loadModelList().then(refreshModelInfo);
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>docuzent — learn a document quickly</title>
<style>
  :root {
    --bg-0: #0a0b10;
    --bg-1: #12141c;
    --panel: rgba(28, 32, 44, 0.55);
    --panel-solid: #1c202c;
    --border: rgba(255, 255, 255, 0.09);
    --border-strong: rgba(255, 255, 255, 0.16);
    --text: #eef0f5;
    --muted: #8b90a8;
    --accent: #6d8dff;
    --accent-2: #8f6dff;
    --accent-text: #06070b;
    --error: #ff7a7a;
    --ok: #5be8b5;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    justify-content: center;
    padding: 40px 16px 64px;
    background: var(--bg-0);
    position: relative;
    overflow-x: hidden;
  }

  /* Fluid, slowly-drifting aurora field behind everything - fixed so it
     never scrolls, blurred heavily so it reads as soft light, not shapes. */
  body::before, body::after {
    content: "";
    position: fixed;
    z-index: 0;
    width: 60vmax;
    height: 60vmax;
    border-radius: 50%;
    filter: blur(90px);
    opacity: 0.35;
    pointer-events: none;
  }
  body::before {
    top: -20vmax;
    left: -15vmax;
    background: radial-gradient(circle, var(--accent), transparent 70%);
    animation: drift1 22s ease-in-out infinite alternate;
  }
  body::after {
    bottom: -25vmax;
    right: -15vmax;
    background: radial-gradient(circle, var(--accent-2), transparent 70%);
    animation: drift2 26s ease-in-out infinite alternate;
  }
  @keyframes drift1 {
    0%   { transform: translate(0, 0) scale(1); }
    100% { transform: translate(8vmax, 10vmax) scale(1.15); }
  }
  @keyframes drift2 {
    0%   { transform: translate(0, 0) scale(1); }
    100% { transform: translate(-6vmax, -8vmax) scale(1.1); }
  }

  main {
    width: 100%;
    max-width: 760px;
    position: relative;
    z-index: 1;
  }
  h1 {
    font-size: 1.6rem;
    margin: 0 0 6px;
    font-weight: 700;
    letter-spacing: -0.02em;
    background: linear-gradient(120deg, var(--text), var(--accent) 140%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    display: inline-block;
  }
  .subtitle {
    color: var(--muted);
    margin: 0 0 28px;
    font-size: 0.95rem;
    line-height: 1.5;
    max-width: 56ch;
  }

  .panel {
    background: var(--panel);
    backdrop-filter: blur(18px) saturate(140%);
    -webkit-backdrop-filter: blur(18px) saturate(140%);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 22px;
    margin-bottom: 18px;
    box-shadow: 0 8px 30px rgba(0, 0, 0, 0.25), inset 0 1px 0 rgba(255, 255, 255, 0.04);
    transition: border-color 0.25s ease, transform 0.25s ease, box-shadow 0.25s ease;
  }
  .panel:hover {
    border-color: var(--border-strong);
  }
  .panel.collapsing {
    animation: collapseOut 0.3s ease forwards;
  }
  @keyframes collapseOut {
    to { opacity: 0; transform: translateY(-6px) scale(0.98); max-height: 0; padding-top: 0; padding-bottom: 0; margin-bottom: 0; overflow: hidden; }
  }
  #qaSection {
    display: none;
    animation: riseIn 0.4s cubic-bezier(0.22, 1, 0.36, 1);
  }
  #qaSection.visible { display: block; }
  @keyframes riseIn {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .row {
    display: flex;
    gap: 10px;
    align-items: flex-end;
    flex-wrap: wrap;
  }
  .field {
    flex: 1 1 180px;
    min-width: 0;
  }
  .field.shrink {
    flex: 0 0 auto;
  }
  label {
    font-size: 0.76rem;
    color: var(--muted);
    display: block;
    margin-bottom: 6px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }

  input[type="file"] {
    color: var(--muted);
    flex: 1 1 220px;
    min-width: 0;
    font-size: 0.85rem;
  }
  input[type="text"], select {
    width: 100%;
    background: rgba(10, 11, 16, 0.55);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 11px 13px;
    color: var(--text);
    font-size: 0.92rem;
    transition: border-color 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
  }
  input[type="text"]:focus, select:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(109, 141, 255, 0.18);
    background: rgba(10, 11, 16, 0.75);
  }
  select { cursor: pointer; }

  button {
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: var(--accent-text);
    border: none;
    border-radius: 10px;
    padding: 11px 20px;
    font-weight: 600;
    cursor: pointer;
    font-size: 0.88rem;
    white-space: nowrap;
    transition: transform 0.15s ease, box-shadow 0.2s ease, opacity 0.2s ease;
    box-shadow: 0 4px 14px rgba(109, 141, 255, 0.25);
  }
  button:disabled {
    opacity: 0.4;
    cursor: not-allowed;
    box-shadow: none;
  }
  button:hover:not(:disabled) {
    transform: translateY(-1px);
    box-shadow: 0 6px 20px rgba(109, 141, 255, 0.4);
  }
  button:active:not(:disabled) { transform: translateY(0); }

  .status {
    margin-top: 14px;
    font-size: 0.86rem;
    color: var(--muted);
    min-height: 1.2em;
    transition: color 0.2s ease;
  }
  .status.error { color: var(--error); }
  .status.ok { color: var(--ok); }

  /* Staged progress: a soft animated bar plus a live-updating label of
     which real stage the ingest pipeline is in - not a generic spinner. */
  .progress {
    display: none;
    margin-top: 14px;
  }
  .progress.active { display: block; }
  .progress-track {
    position: relative;
    height: 6px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.07);
    overflow: hidden;
  }
  .progress-fill {
    position: absolute;
    inset: 0;
    width: 0%;
    border-radius: 999px;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    transition: width 0.5s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .progress-fill::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.5), transparent);
    width: 40%;
    animation: shimmer 1.3s linear infinite;
  }
  @keyframes shimmer {
    from { transform: translateX(-100%); }
    to   { transform: translateX(350%); }
  }
  .stages {
    display: flex;
    justify-content: space-between;
    margin-top: 10px;
    font-size: 0.72rem;
    color: var(--muted);
  }
  .stage { display: flex; align-items: center; gap: 5px; transition: color 0.25s ease; }
  .stage.done { color: var(--ok); }
  .stage.active { color: var(--accent); }
  .stage-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: currentColor;
    opacity: 0.5;
  }
  .stage.active .stage-dot {
    animation: pulseDot 1s ease-in-out infinite;
  }
  .stage.done .stage-dot { opacity: 1; }
  @keyframes pulseDot {
    0%, 100% { opacity: 0.4; transform: scale(1); }
    50% { opacity: 1; transform: scale(1.4); }
  }

  .transcript {
    display: flex;
    flex-direction: column;
    gap: 18px;
    margin-top: 18px;
  }
  .turn {
    border-left: 2px solid var(--accent);
    padding-left: 14px;
    animation: riseIn 0.35s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .question {
    color: var(--muted);
    font-size: 0.84rem;
    margin-bottom: 5px;
  }
  .answer {
    white-space: pre-wrap;
    line-height: 1.55;
    font-size: 0.96rem;
  }
  .meta {
    color: var(--muted);
    font-size: 0.76rem;
    margin-top: 8px;
    opacity: 0.85;
  }
  .badge {
    display: inline-block;
    padding: 1px 8px;
    border-radius: 999px;
    background: rgba(109, 141, 255, 0.15);
    color: var(--accent);
    font-size: 0.7rem;
    margin-right: 6px;
  }

  footer {
    color: var(--muted);
    font-size: 0.76rem;
    text-align: center;
    margin-top: 20px;
    opacity: 0.75;
  }
</style>
</head>
<body>
<main>
  <h1>docuzent</h1>
  <p class="subtitle">Learn documents quickly — upload one or more files (or .zips of them), loaded together as one corpus, then ask anything.</p>

  <section class="panel">
    <div class="row">
      <div class="field">
        <label for="modelSelect">Model</label>
        <select id="modelSelect"></select>
      </div>
      <div class="field">
        <label for="modeSelect">Cache mode</label>
        <select id="modeSelect">
          <option value="adaptive">adaptive — predict swap vs. raw</option>
          <option value="swap">swap — always reuse cached context</option>
          <option value="raw">raw — never reuse, always cold</option>
        </select>
      </div>
      <div class="field shrink">
        <label>&nbsp;</label>
        <button id="switchBtn">Apply</button>
      </div>
    </div>
    <div class="status" id="switchStatus"></div>
  </section>

  <section class="panel">
    <div class="row">
      <input type="file" id="fileInput" accept="*/*" multiple>
      <button id="loadBtn">Load document(s)</button>
    </div>
    <div class="status" id="loadStatus"></div>
    <div class="progress" id="loadProgress">
      <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
      <div class="stages">
        <div class="stage" data-stage="upload"><span class="stage-dot"></span>Uploading</div>
        <div class="stage" data-stage="docling"><span class="stage-dot"></span>Parsing (Docling)</div>
        <div class="stage" data-stage="chunk"><span class="stage-dot"></span>Chunking</div>
        <div class="stage" data-stage="ready"><span class="stage-dot"></span>Ready</div>
      </div>
    </div>
  </section>

  <section class="panel" id="qaSection">
    <div class="row">
      <input type="text" id="questionInput" placeholder="Ask a question about this document…">
      <button id="askBtn">Ask</button>
    </div>
    <div class="status" id="askStatus"></div>
    <div class="transcript" id="transcript"></div>
  </section>

  <footer id="modelInfo"></footer>
</main>

<script>
const loadBtn = document.getElementById('loadBtn');
const fileInput = document.getElementById('fileInput');
const loadStatus = document.getElementById('loadStatus');
const loadProgress = document.getElementById('loadProgress');
const progressFill = document.getElementById('progressFill');
const qaSection = document.getElementById('qaSection');
const questionInput = document.getElementById('questionInput');
const askBtn = document.getElementById('askBtn');
const askStatus = document.getElementById('askStatus');
const transcript = document.getElementById('transcript');
const modelInfo = document.getElementById('modelInfo');
const modelSelect = document.getElementById('modelSelect');
const modeSelect = document.getElementById('modeSelect');
const switchBtn = document.getElementById('switchBtn');
const switchStatus = document.getElementById('switchStatus');

function setStatus(el, text, kind) {
  el.textContent = text;
  el.classList.toggle('error', kind === 'error');
  el.classList.toggle('ok', kind === 'ok');
}

// The backend answers /load in one shot (see docuzent#22 for real
// per-file streaming) - this walks the visible stage indicator through
// the pipeline's real shape (upload -> Docling parse -> chunk -> ready)
// on realistic timing while the one real request is in flight, then
// snaps straight to "ready" the moment the real response actually
// arrives, whichever stage it was on. Honest about being an estimate:
// it never claims completion before the real request resolves.
const STAGE_ORDER = ['upload', 'docling', 'chunk', 'ready'];
let stageTimer = null;

function setStage(name, fraction) {
  progressFill.style.width = `${fraction}%`;
  const idx = STAGE_ORDER.indexOf(name);
  document.querySelectorAll('.stage').forEach(el => {
    const elIdx = STAGE_ORDER.indexOf(el.dataset.stage);
    el.classList.toggle('active', elIdx === idx);
    el.classList.toggle('done', elIdx < idx);
  });
}

function startProgress(fileCount) {
  loadProgress.classList.add('active');
  setStage('upload', 8);
  let step = 0;
  const plan = [
    { stage: 'upload', at: 300, pct: 18 },
    { stage: 'docling', at: 900, pct: 35 },
    { stage: 'docling', at: 1800 + fileCount * 250, pct: 60 },
    { stage: 'docling', at: 3200 + fileCount * 500, pct: 78 },
    { stage: 'chunk', at: 4200 + fileCount * 600, pct: 90 },
  ];
  const t0 = Date.now();
  stageTimer = setInterval(() => {
    const elapsed = Date.now() - t0;
    while (step < plan.length && elapsed >= plan[step].at) {
      setStage(plan[step].stage, plan[step].pct);
      step++;
    }
  }, 120);
}

function finishProgress(success) {
  if (stageTimer) { clearInterval(stageTimer); stageTimer = null; }
  if (success) {
    setStage('ready', 100);
    setTimeout(() => loadProgress.classList.remove('active'), 900);
  } else {
    loadProgress.classList.remove('active');
  }
}

async function loadDocument() {
  const files = Array.from(fileInput.files);
  if (files.length === 0) {
    setStatus(loadStatus, 'Choose at least one file first.', 'error');
    return;
  }
  loadBtn.disabled = true;
  setStatus(loadStatus, `Loading ${files.length} file(s)…`, null);
  startProgress(files.length);

  const form = new FormData();
  for (const file of files) {
    form.append('file', file, file.name);
  }

  try {
    const resp = await fetch('/load', { method: 'POST', body: form });
    const data = await resp.json();
    if (!data.ok) {
      finishProgress(false);
      setStatus(loadStatus, data.error || 'Failed to load document.', 'error');
      return;
    }
    finishProgress(true);
    setStatus(
      loadStatus,
      `Loaded ${files.length} file(s), ${data.chars.toLocaleString()} chars — ${data.fits_in_one_chunk ? 'fits in one chunk' : 'will use map-reduce'} — ${data.warm_from_disk ? 'a cached context is available on disk' : 'cold, not seen before'}`,
      'ok'
    );
    qaSection.classList.add('visible');
    transcript.innerHTML = '';
    questionInput.focus();
  } catch (e) {
    finishProgress(false);
    setStatus(loadStatus, 'Request failed: ' + e, 'error');
  } finally {
    loadBtn.disabled = false;
  }
}

async function askQuestion() {
  const question = questionInput.value.trim();
  if (!question) return;
  askBtn.disabled = true;
  questionInput.disabled = true;
  setStatus(askStatus, '', null);
  askStatus.innerHTML = '<span class="badge">thinking</span>working through the document…';

  try {
    const resp = await fetch('/ask', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ question }),
    });
    const data = await resp.json();
    if (!data.ok) {
      setStatus(askStatus, data.error || 'Failed to answer.', 'error');
      return;
    }
    setStatus(askStatus, '', null);
    const turn = document.createElement('div');
    turn.className = 'turn';
    const metaBits = data.timings.map(t => `${t.label}: ${t.prompt_eval_duration_ms.toFixed(0)}ms/${t.prompt_eval_count}tok`).join(' · ');
    const modeBit = data.used_map_reduce ? `map-reduce · ${data.chunks_mapped} chunks` : 'single chunk';
    const adaptiveBit = data.adaptive_decision
      ? ` · adaptive: swap ${data.adaptive_decision.predicted_swap_ms.toFixed(0)}ms vs raw ${data.adaptive_decision.predicted_raw_ms.toFixed(0)}ms → chose ${data.adaptive_decision.chose_swap ? 'swap' : 'raw'}`
      : '';
    turn.innerHTML = `
      <div class="question">${escapeHtml(question)}</div>
      <div class="answer">${escapeHtml(data.answer)}</div>
      <div class="meta"><span class="badge">${modeBit}</span>${metaBits}${adaptiveBit}</div>
    `;
    transcript.prepend(turn);
    questionInput.value = '';
  } catch (e) {
    setStatus(askStatus, 'Request failed: ' + e, 'error');
  } finally {
    askBtn.disabled = false;
    questionInput.disabled = false;
    questionInput.focus();
  }
}

function escapeHtml(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

async function refreshModelInfo() {
  try {
    const resp = await fetch('/model-info');
    const d = await resp.json();
    if (!d.ok) {
      modelInfo.textContent = d.error || 'model info unavailable';
      return;
    }
    modelInfo.textContent = `model: ${d.model} · mode: ${d.mode} · context window: ${d.context_length.toLocaleString()} tokens · cache: ${d.cache_path}`;
    modelSelect.value = d.model;
    modeSelect.value = d.mode;
  } catch (e) {
    modelInfo.textContent = 'model info unavailable: ' + e;
  }
}

async function loadModelList() {
  try {
    const resp = await fetch('/models');
    const data = await resp.json();
    if (!data.ok) {
      setStatus(switchStatus, data.error || 'Failed to list models.', 'error');
      return;
    }
    modelSelect.innerHTML = '';
    for (const name of data.models) {
      const opt = document.createElement('option');
      opt.value = name;
      opt.textContent = name;
      modelSelect.appendChild(opt);
    }
  } catch (e) {
    setStatus(switchStatus, 'Request failed: ' + e, 'error');
  }
}

async function switchModel() {
  const model = modelSelect.value;
  const mode = modeSelect.value;
  if (!model) {
    setStatus(switchStatus, 'Choose a model first.', 'error');
    return;
  }
  switchBtn.disabled = true;
  setStatus(switchStatus, 'Switching…', null);
  try {
    const resp = await fetch('/model', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ model, mode }),
    });
    const data = await resp.json();
    if (!data.ok) {
      setStatus(switchStatus, data.error || 'Failed to switch.', 'error');
      return;
    }
    setStatus(switchStatus, `Now using ${data.model} (${data.mode}, ${data.context_length.toLocaleString()} tokens). Load your document(s) again.`, 'ok');
    // Switching models replaces the session - whatever was loaded before
    // is gone, so hide the Q&A section until something is loaded again.
    qaSection.classList.remove('visible');
    transcript.innerHTML = '';
    await refreshModelInfo();
  } catch (e) {
    setStatus(switchStatus, 'Request failed: ' + e, 'error');
  } finally {
    switchBtn.disabled = false;
  }
}

loadBtn.addEventListener('click', loadDocument);
askBtn.addEventListener('click', askQuestion);
switchBtn.addEventListener('click', switchModel);
questionInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') askQuestion(); });

loadModelList().then(refreshModelInfo);
</script>
</body>
</html>

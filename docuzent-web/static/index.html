<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>docuzent — learn a document quickly</title>
<style>
  :root {
    --bg-0: #0a0b10;
    --bg-1: #12141c;
    --panel: rgba(28, 32, 44, 0.55);
    --panel-solid: #1c202c;
    --border: rgba(255, 255, 255, 0.09);
    --border-strong: rgba(255, 255, 255, 0.16);
    --text: #eef0f5;
    --muted: #8b90a8;
    --accent: #6d8dff;
    --accent-2: #8f6dff;
    --accent-text: #06070b;
    --error: #ff7a7a;
    --ok: #5be8b5;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    justify-content: center;
    padding: 40px 16px 64px;
    background: var(--bg-0);
    position: relative;
    overflow-x: hidden;
  }

  /* Fluid, slowly-drifting aurora field behind everything - fixed so it
     never scrolls, blurred heavily so it reads as soft light, not shapes. */
  body::before, body::after {
    content: "";
    position: fixed;
    z-index: 0;
    width: 60vmax;
    height: 60vmax;
    border-radius: 50%;
    filter: blur(90px);
    opacity: 0.35;
    pointer-events: none;
  }
  body::before {
    top: -20vmax;
    left: -15vmax;
    background: radial-gradient(circle, var(--accent), transparent 70%);
    animation: drift1 22s ease-in-out infinite alternate;
  }
  body::after {
    bottom: -25vmax;
    right: -15vmax;
    background: radial-gradient(circle, var(--accent-2), transparent 70%);
    animation: drift2 26s ease-in-out infinite alternate;
  }
  @keyframes drift1 {
    0%   { transform: translate(0, 0) scale(1); }
    100% { transform: translate(8vmax, 10vmax) scale(1.15); }
  }
  @keyframes drift2 {
    0%   { transform: translate(0, 0) scale(1); }
    100% { transform: translate(-6vmax, -8vmax) scale(1.1); }
  }

  main {
    width: 100%;
    max-width: 760px;
    position: relative;
    z-index: 1;
  }
  h1 {
    font-size: 1.6rem;
    margin: 0 0 6px;
    font-weight: 700;
    letter-spacing: -0.02em;
    background: linear-gradient(120deg, var(--text), var(--accent) 140%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    display: inline-block;
  }
  .subtitle {
    color: var(--muted);
    margin: 0 0 28px;
    font-size: 0.95rem;
    line-height: 1.5;
    max-width: 56ch;
  }

  .panel {
    background: var(--panel);
    backdrop-filter: blur(18px) saturate(140%);
    -webkit-backdrop-filter: blur(18px) saturate(140%);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 22px;
    margin-bottom: 18px;
    box-shadow: 0 8px 30px rgba(0, 0, 0, 0.25), inset 0 1px 0 rgba(255, 255, 255, 0.04);
    transition: border-color 0.25s ease, transform 0.25s ease, box-shadow 0.25s ease;
  }
  .panel:hover {
    border-color: var(--border-strong);
  }
  .panel.collapsing {
    animation: collapseOut 0.3s ease forwards;
  }
  @keyframes collapseOut {
    to { opacity: 0; transform: translateY(-6px) scale(0.98); max-height: 0; padding-top: 0; padding-bottom: 0; margin-bottom: 0; overflow: hidden; }
  }
  #qaSection {
    display: none;
    animation: riseIn 0.4s cubic-bezier(0.22, 1, 0.36, 1);
  }
  #qaSection.visible { display: block; }
  @keyframes riseIn {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .row {
    display: flex;
    gap: 10px;
    align-items: flex-end;
    flex-wrap: wrap;
  }
  .field {
    flex: 1 1 180px;
    min-width: 0;
  }
  .field.shrink {
    flex: 0 0 auto;
  }
  label {
    font-size: 0.76rem;
    color: var(--muted);
    display: block;
    margin-bottom: 6px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }

  input[type="file"] {
    color: var(--muted);
    flex: 1 1 220px;
    min-width: 0;
    font-size: 0.85rem;
  }
  input[type="text"], select {
    width: 100%;
    background: rgba(10, 11, 16, 0.55);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 11px 13px;
    color: var(--text);
    font-size: 0.92rem;
    transition: border-color 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
  }
  input[type="text"]:focus, select:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(109, 141, 255, 0.18);
    background: rgba(10, 11, 16, 0.75);
  }
  select { cursor: pointer; }

  button {
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: var(--accent-text);
    border: none;
    border-radius: 10px;
    padding: 11px 20px;
    font-weight: 600;
    cursor: pointer;
    font-size: 0.88rem;
    white-space: nowrap;
    transition: transform 0.15s ease, box-shadow 0.2s ease, opacity 0.2s ease;
    box-shadow: 0 4px 14px rgba(109, 141, 255, 0.25);
  }
  button:disabled {
    opacity: 0.4;
    cursor: not-allowed;
    box-shadow: none;
  }
  button:hover:not(:disabled) {
    transform: translateY(-1px);
    box-shadow: 0 6px 20px rgba(109, 141, 255, 0.4);
  }
  button:active:not(:disabled) { transform: translateY(0); }

  .status {
    margin-top: 14px;
    font-size: 0.86rem;
    color: var(--muted);
    min-height: 1.2em;
    transition: color 0.2s ease;
  }
  .status.error { color: var(--error); }
  .status.ok { color: var(--ok); }

  /* Staged progress: a soft animated bar plus a live-updating label of
     which real stage the ingest pipeline is in - not a generic spinner. */
  .progress {
    display: none;
    margin-top: 14px;
  }
  .progress.active { display: block; }
  .progress-track {
    position: relative;
    height: 6px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.07);
    overflow: hidden;
  }
  .progress-fill {
    position: absolute;
    inset: 0;
    width: 0%;
    border-radius: 999px;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    transition: width 0.5s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .progress-fill::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.5), transparent);
    width: 40%;
    animation: shimmer 1.3s linear infinite;
  }
  @keyframes shimmer {
    from { transform: translateX(-100%); }
    to   { transform: translateX(350%); }
  }
  .stages {
    display: flex;
    justify-content: space-between;
    margin-top: 10px;
    font-size: 0.72rem;
    color: var(--muted);
  }
  .stage { display: flex; align-items: center; gap: 5px; transition: color 0.25s ease; }
  .stage.done { color: var(--ok); }
  .stage.active { color: var(--accent); }
  .stage-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: currentColor;
    opacity: 0.5;
  }
  .stage.active .stage-dot {
    animation: pulseDot 1s ease-in-out infinite;
  }
  .stage.done .stage-dot { opacity: 1; }
  @keyframes pulseDot {
    0%, 100% { opacity: 0.4; transform: scale(1); }
    50% { opacity: 1; transform: scale(1.4); }
  }

  .transcript {
    display: flex;
    flex-direction: column;
    gap: 18px;
    margin-top: 18px;
  }
  .turn {
    border-left: 2px solid var(--accent);
    padding-left: 14px;
    animation: riseIn 0.35s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .question {
    color: var(--muted);
    font-size: 0.84rem;
    margin-bottom: 5px;
  }
  .answer {
    white-space: pre-wrap;
    line-height: 1.55;
    font-size: 0.96rem;
  }
  .meta {
    color: var(--muted);
    font-size: 0.76rem;
    margin-top: 8px;
    opacity: 0.85;
  }
  .badge {
    display: inline-block;
    padding: 1px 8px;
    border-radius: 999px;
    background: rgba(109, 141, 255, 0.15);
    color: var(--accent);
    font-size: 0.7rem;
    margin-right: 6px;
  }

  /* Answer citations - real per-chunk extractions, collapsed by default */
  details.sources {
    margin-top: 8px;
    font-size: 0.8rem;
    color: var(--muted);
  }
  details.sources summary {
    cursor: pointer;
    color: var(--accent);
  }
  .source-excerpt {
    margin-top: 8px;
    padding: 8px 10px;
    border-radius: 8px;
    background: rgba(255, 255, 255, 0.03);
    border: 1px solid var(--border);
    line-height: 1.5;
  }

  /* Context-size slider + its live VRAM estimate bar */
  .ctx-row { margin-top: 14px; }
  .ctx-label-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 6px;
  }
  .ctx-value {
    font-size: 0.82rem;
    color: var(--text);
    font-variant-numeric: tabular-nums;
  }
  input[type="range"] {
    width: 100%;
    -webkit-appearance: none;
    appearance: none;
    height: 6px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.1);
    outline: none;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: var(--accent);
    cursor: pointer;
    box-shadow: 0 0 0 4px rgba(109, 141, 255, 0.18);
    transition: background 0.2s ease;
  }
  input[type="range"].vram-over::-webkit-slider-thumb { background: var(--error); box-shadow: 0 0 0 4px rgba(255, 122, 122, 0.2); }
  input[type="range"]::-moz-range-thumb {
    width: 16px;
    height: 16px;
    border: none;
    border-radius: 50%;
    background: var(--accent);
    cursor: pointer;
  }
  input[type="range"].vram-over::-moz-range-thumb { background: var(--error); }
  .vram-estimate {
    margin-top: 8px;
    font-size: 0.78rem;
    color: var(--muted);
    border-radius: 8px;
    padding: 8px 10px;
    background: rgba(255, 255, 255, 0.03);
    border: 1px solid var(--border);
    transition: background 0.2s ease, border-color 0.2s ease, color 0.2s ease;
  }
  .vram-estimate.over {
    color: var(--error);
    background: rgba(255, 122, 122, 0.08);
    border-color: rgba(255, 122, 122, 0.35);
  }

  /* Persistent, real (not estimated) RAM-offload ground-truth badge */
  .ram-offload-badge {
    display: none;
    margin-top: 10px;
    font-size: 0.8rem;
    color: var(--error);
    background: rgba(255, 122, 122, 0.1);
    border: 1px solid rgba(255, 122, 122, 0.35);
    border-radius: 8px;
    padding: 8px 10px;
  }
  .ram-offload-badge.visible { display: block; }

  /* Ingestion token progress - an *estimate*, always labeled as one */
  .token-progress {
    display: none;
    margin-top: 10px;
    font-size: 0.78rem;
    color: var(--muted);
  }
  .token-progress.visible { display: block; }
  .token-progress-track {
    position: relative;
    height: 5px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.07);
    overflow: hidden;
    margin-top: 5px;
  }
  .token-progress-fill {
    position: absolute;
    inset: 0;
    width: 0%;
    border-radius: 999px;
    background: linear-gradient(90deg, var(--accent-2), var(--accent));
    transition: width 0.3s ease;
  }

  footer {
    color: var(--muted);
    font-size: 0.76rem;
    text-align: center;
    margin-top: 20px;
    opacity: 0.75;
  }
</style>
</head>
<body>
<main>
  <h1>docuzent</h1>
  <p class="subtitle">Learn documents quickly — upload one or more files (or .zips of them), loaded together as one corpus, then ask anything.</p>

  <section class="panel">
    <div class="row">
      <div class="field">
        <label for="modelSelect">Model</label>
        <select id="modelSelect"></select>
      </div>
      <div class="field">
        <label for="modeSelect">Cache mode</label>
        <select id="modeSelect">
          <option value="adaptive">adaptive — predict swap vs. raw</option>
          <option value="swap">swap — always reuse cached context</option>
          <option value="raw">raw — never reuse, always cold</option>
        </select>
      </div>
      <div class="field shrink">
        <label>&nbsp;</label>
        <button id="switchBtn">Apply</button>
      </div>
    </div>
    <div class="ctx-row">
      <div class="ctx-label-row">
        <label for="contextSlider" style="margin-bottom: 0;">Context size</label>
        <span class="ctx-value" id="contextValue">—</span>
      </div>
      <input type="range" id="contextSlider" min="1024" max="4096" value="4096" step="256">
      <div class="vram-estimate" id="vramEstimate">Pick a model to see its real context window and VRAM estimate.</div>
    </div>
    <div class="status" id="switchStatus"></div>
    <div class="ram-offload-badge" id="ramOffloadBadge"></div>
  </section>

  <section class="panel">
    <div class="row">
      <input type="file" id="fileInput" accept="*/*" multiple>
      <button id="loadBtn">Load document(s)</button>
    </div>
    <label style="display: flex; align-items: center; gap: 6px; margin-top: 10px; text-transform: none; letter-spacing: normal; cursor: pointer;">
      <input type="checkbox" id="textOnlyCheckbox" style="margin: 0;">
      Plain text / source code (skip Docling)
    </label>
    <div class="status" id="loadStatus"></div>
    <div class="progress" id="loadProgress">
      <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
      <div class="stages">
        <div class="stage" data-stage="upload"><span class="stage-dot"></span>Uploading</div>
        <div class="stage" data-stage="docling"><span class="stage-dot"></span>Parsing (Docling)</div>
        <div class="stage" data-stage="chunk"><span class="stage-dot"></span>Chunking</div>
        <div class="stage" data-stage="ready"><span class="stage-dot"></span>Ready</div>
      </div>
    </div>
  </section>

  <section class="panel">
    <div class="row">
      <div class="field">
        <label for="workspaceSelect">Saved workspaces</label>
        <select id="workspaceSelect"><option value="">— none saved —</option></select>
      </div>
      <div class="field shrink"><label>&nbsp;</label><button id="loadWorkspaceBtn">Load</button></div>
      <div class="field shrink"><label>&nbsp;</label><button id="deleteWorkspaceBtn">Delete</button></div>
    </div>
    <div class="row" style="margin-top: 10px;">
      <input type="text" id="workspaceNameInput" placeholder="Name this workspace to save the currently loaded document(s)…">
      <button id="saveWorkspaceBtn">Save current as workspace</button>
    </div>
    <div class="status" id="workspaceStatus"></div>
  </section>

  <section class="panel" id="qaSection">
    <div class="row">
      <input type="text" id="questionInput" placeholder="Ask a question about this document…">
      <button id="askBtn">Ask</button>
    </div>
    <div class="status" id="askStatus"></div>
    <div class="token-progress" id="tokenProgress">
      <span id="tokenProgressLabel"></span>
      <div class="token-progress-track"><div class="token-progress-fill" id="tokenProgressFill"></div></div>
    </div>
    <div class="transcript" id="transcript"></div>
  </section>

  <footer id="modelInfo"></footer>
</main>

<script>
const loadBtn = document.getElementById('loadBtn');
const fileInput = document.getElementById('fileInput');
const textOnlyCheckbox = document.getElementById('textOnlyCheckbox');
const workspaceSelect = document.getElementById('workspaceSelect');
const loadWorkspaceBtn = document.getElementById('loadWorkspaceBtn');
const deleteWorkspaceBtn = document.getElementById('deleteWorkspaceBtn');
const workspaceNameInput = document.getElementById('workspaceNameInput');
const saveWorkspaceBtn = document.getElementById('saveWorkspaceBtn');
const workspaceStatus = document.getElementById('workspaceStatus');
const loadStatus = document.getElementById('loadStatus');
const loadProgress = document.getElementById('loadProgress');
const progressFill = document.getElementById('progressFill');
const qaSection = document.getElementById('qaSection');
const questionInput = document.getElementById('questionInput');
const askBtn = document.getElementById('askBtn');
const askStatus = document.getElementById('askStatus');
const transcript = document.getElementById('transcript');
const modelInfo = document.getElementById('modelInfo');
const modelSelect = document.getElementById('modelSelect');
const modeSelect = document.getElementById('modeSelect');
const switchBtn = document.getElementById('switchBtn');
const switchStatus = document.getElementById('switchStatus');
const contextSlider = document.getElementById('contextSlider');
const contextValue = document.getElementById('contextValue');
const vramEstimate = document.getElementById('vramEstimate');
const ramOffloadBadge = document.getElementById('ramOffloadBadge');
const tokenProgress = document.getElementById('tokenProgress');
const tokenProgressLabel = document.getElementById('tokenProgressLabel');
const tokenProgressFill = document.getElementById('tokenProgressFill');

function setStatus(el, text, kind) {
  el.textContent = text;
  el.classList.toggle('error', kind === 'error');
  el.classList.toggle('ok', kind === 'ok');
}

function formatGB(bytes) {
  return (bytes / 1e9).toFixed(1);
}

// The context-size slider's real bounds/estimate for whichever model is
// currently selected in the dropdown - independent of whichever model
// the *active session* happens to be using, so picking a different model
// updates the slider before "Apply" is even clicked. See docuzent#29/#30.
let currentVram = null;

// Live, client-side estimate using the exact same formula the backend
// uses to pick a safe default (weight_bytes + kv_bytes_per_token * tokens
// + overhead_bytes), so the slider's red/green state always agrees with
// what the backend would actually do at that value - no guessing at a
// second copy of the formula.
function renderVramEstimate() {
  if (!currentVram) {
    vramEstimate.textContent = 'Pick a model to see its real context window and VRAM estimate.';
    vramEstimate.classList.remove('over');
    contextSlider.classList.remove('vram-over');
    return;
  }
  const tokens = parseInt(contextSlider.value, 10);
  contextValue.textContent = `${tokens.toLocaleString()} tokens`;

  const estimatedBytes = currentVram.weight_bytes + currentVram.kv_bytes_per_token * tokens + currentVram.overhead_bytes;
  const trainedCeiling = currentVram.original_context_length || currentVram.nominal_context_length;
  const lines = [`~${formatGB(estimatedBytes)} GB estimated VRAM at this size (model ~${formatGB(currentVram.weight_bytes)} GB + KV cache)`];

  if (currentVram.original_context_length && currentVram.original_context_length !== currentVram.nominal_context_length) {
    lines.push(`nominal window (${currentVram.nominal_context_length.toLocaleString()}) is RoPE-extrapolated - really trained on ${currentVram.original_context_length.toLocaleString()}`);
  }

  let over = false;
  if (currentVram.vram_free_bytes != null) {
    const budget = currentVram.vram_free_bytes * currentVram.safety_fraction;
    over = estimatedBytes > budget;
    lines.push(
      over
        ? `RAM OFFLOAD LIKELY: exceeds the safe VRAM budget (~${formatGB(budget)} GB of ~${formatGB(currentVram.vram_free_bytes)} GB free) - will run slower, spilling to system RAM`
        : `fits within free VRAM (~${formatGB(currentVram.vram_free_bytes)} GB free)`
    );
  } else {
    lines.push('free VRAM could not be measured (no NVIDIA GPU detected)');
  }
  if (tokens > trainedCeiling) {
    lines.push(`above the model's real trained context (${trainedCeiling.toLocaleString()}) - answer quality may degrade even if it fits in VRAM`);
  }
  if (tokens < currentVram.nominal_context_length) {
    lines.push('a document larger than this will automatically use map-reduce');
  }

  vramEstimate.textContent = lines.join(' · ');
  vramEstimate.classList.toggle('over', over);
  contextSlider.classList.toggle('vram-over', over);
}

async function fetchContextEstimateFor(model) {
  if (!model) return;
  try {
    const resp = await fetch(`/context-estimate?model=${encodeURIComponent(model)}`);
    const data = await resp.json();
    if (!data.ok) {
      currentVram = null;
      vramEstimate.textContent = data.error || 'Could not estimate VRAM for this model.';
      vramEstimate.classList.add('over');
      return;
    }
    currentVram = data.vram;
    contextSlider.min = 1024;
    contextSlider.max = currentVram.nominal_context_length;
    contextSlider.step = Math.max(256, Math.round(currentVram.nominal_context_length / 200));
    contextSlider.value = currentVram.safe_context_length;
    renderVramEstimate();
  } catch (e) {
    currentVram = null;
    vramEstimate.textContent = 'Request failed: ' + e;
    vramEstimate.classList.add('over');
  }
}

function showRamOffloadBadge(warning) {
  if (warning) {
    ramOffloadBadge.textContent = warning;
    ramOffloadBadge.classList.add('visible');
  } else {
    ramOffloadBadge.classList.remove('visible');
  }
}

// The backend answers /load in one shot (see docuzent#22 for real
// per-file streaming) - this walks the visible stage indicator through
// the pipeline's real shape (upload -> Docling parse -> chunk -> ready)
// on realistic timing while the one real request is in flight, then
// snaps straight to "ready" the moment the real response actually
// arrives, whichever stage it was on. Honest about being an estimate:
// it never claims completion before the real request resolves.
const STAGE_ORDER = ['upload', 'docling', 'chunk', 'ready'];
let stageTimer = null;

function setStage(name, fraction) {
  progressFill.style.width = `${fraction}%`;
  const idx = STAGE_ORDER.indexOf(name);
  document.querySelectorAll('.stage').forEach(el => {
    const elIdx = STAGE_ORDER.indexOf(el.dataset.stage);
    el.classList.toggle('active', elIdx === idx);
    el.classList.toggle('done', elIdx < idx);
  });
}

function startProgress(fileCount) {
  loadProgress.classList.add('active');
  setStage('upload', 8);
  let step = 0;
  const plan = [
    { stage: 'upload', at: 300, pct: 18 },
    { stage: 'docling', at: 900, pct: 35 },
    { stage: 'docling', at: 1800 + fileCount * 250, pct: 60 },
    { stage: 'docling', at: 3200 + fileCount * 500, pct: 78 },
    { stage: 'chunk', at: 4200 + fileCount * 600, pct: 90 },
  ];
  const t0 = Date.now();
  stageTimer = setInterval(() => {
    const elapsed = Date.now() - t0;
    while (step < plan.length && elapsed >= plan[step].at) {
      setStage(plan[step].stage, plan[step].pct);
      step++;
    }
  }, 120);
}

function finishProgress(success) {
  if (stageTimer) { clearInterval(stageTimer); stageTimer = null; }
  if (success) {
    setStage('ready', 100);
    setTimeout(() => loadProgress.classList.remove('active'), 900);
  } else {
    loadProgress.classList.remove('active');
  }
}

async function loadDocument() {
  const files = Array.from(fileInput.files);
  if (files.length === 0) {
    setStatus(loadStatus, 'Choose at least one file first.', 'error');
    return;
  }
  loadBtn.disabled = true;
  setStatus(loadStatus, `Loading ${files.length} file(s)…`, null);
  startProgress(files.length);

  const form = new FormData();
  for (const file of files) {
    form.append('file', file, file.name);
  }
  if (textOnlyCheckbox.checked) {
    form.append('text_only', 'true');
  }

  try {
    const resp = await fetch('/load', { method: 'POST', body: form });
    const data = await resp.json();
    if (!data.ok) {
      finishProgress(false);
      setStatus(loadStatus, data.error || 'Failed to load document.', 'error');
      return;
    }
    finishProgress(true);
    setStatus(
      loadStatus,
      `Loaded ${files.length} file(s), ${data.chars.toLocaleString()} chars — ${data.fits_in_one_chunk ? 'fits in one chunk' : 'will use map-reduce'} — ${data.warm_from_disk ? 'a cached context is available on disk' : 'cold, not seen before'}`,
      'ok'
    );
    qaSection.classList.add('visible');
    transcript.innerHTML = '';
    questionInput.focus();
  } catch (e) {
    finishProgress(false);
    setStatus(loadStatus, 'Request failed: ' + e, 'error');
  } finally {
    loadBtn.disabled = false;
  }
}

// Ollama's API exposes no live prefill-progress signal - this polls the
// backend's own *estimate* (elapsed time × this session's real measured
// throughput, see docuzent-web's /progress handler) while an /ask request
// that might be doing a slow cold prime is in flight. Always labeled as
// an estimate; shown as indeterminate when there's no measured rate yet
// (a first-ever call for this model/context length) rather than a
// fabricated number.
let progressPoll = null;

function startTokenProgressPolling() {
  tokenProgress.classList.add('visible');
  tokenProgressLabel.textContent = 'Checking…';
  tokenProgressFill.style.width = '0%';
  progressPoll = setInterval(async () => {
    try {
      const resp = await fetch('/progress');
      const p = await resp.json();
      if (!p.active) return;
      if (p.tokens_per_sec > 0) {
        const pct = p.estimated_tokens_total > 0 ? Math.min(100, (p.estimated_tokens_done / p.estimated_tokens_total) * 100) : 0;
        tokenProgressFill.style.width = `${pct}%`;
        tokenProgressLabel.textContent = `~${p.estimated_tokens_done.toLocaleString()} / ~${p.estimated_tokens_total.toLocaleString()} tokens ingested (estimated)`;
      } else {
        tokenProgressFill.style.width = '15%';
        tokenProgressLabel.textContent = `${p.label || 'working'}… (no timing data yet to estimate progress)`;
      }
    } catch (e) { /* transient - next tick will retry */ }
  }, 400);
}

function stopTokenProgressPolling() {
  if (progressPoll) { clearInterval(progressPoll); progressPoll = null; }
  tokenProgress.classList.remove('visible');
}

// Reads /ask-stream's Server-Sent Events manually (not the native
// EventSource API, since that only supports GET - this needs a JSON
// POST body) - splits the raw response body on the SSE "\n\n" event
// delimiter, parsing each event's `data:` line as JSON. A `{"token":...}`
// event is a real, live fragment of the answer as Ollama actually
// generates it (see docuzent#35) - anything else is the final
// AskResponse-shaped summary.
async function askQuestion() {
  const question = questionInput.value.trim();
  if (!question) return;
  askBtn.disabled = true;
  questionInput.disabled = true;
  setStatus(askStatus, '', null);
  askStatus.innerHTML = '<span class="badge">thinking</span>working through the document…';
  startTokenProgressPolling();

  const turn = document.createElement('div');
  turn.className = 'turn';
  const answerDiv = document.createElement('div');
  answerDiv.className = 'answer';
  turn.innerHTML = `<div class="question">${escapeHtml(question)}</div>`;
  turn.appendChild(answerDiv);
  transcript.prepend(turn);

  try {
    const resp = await fetch('/ask-stream', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ question }),
    });
    if (!resp.ok || !resp.body) {
      throw new Error(`HTTP ${resp.status}`);
    }

    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';
    let finalData = null;

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      let sepIndex;
      while ((sepIndex = buffer.indexOf('\n\n')) !== -1) {
        const rawEvent = buffer.slice(0, sepIndex);
        buffer = buffer.slice(sepIndex + 2);
        const dataLine = rawEvent.split('\n').find(l => l.startsWith('data:'));
        if (!dataLine) continue;
        let data;
        try { data = JSON.parse(dataLine.slice(5).trim()); } catch (e) { continue; }
        if ('token' in data) {
          answerDiv.textContent += data.token;
        } else {
          finalData = data;
        }
      }
    }

    stopTokenProgressPolling();
    if (!finalData || !finalData.ok) {
      setStatus(askStatus, (finalData && finalData.error) || 'Failed to answer.', 'error');
      turn.remove();
      return;
    }
    setStatus(askStatus, '', null);
    showRamOffloadBadge(finalData.ram_offload_warning);
    const metaBits = finalData.timings.map(t => `${t.label}: ${t.prompt_eval_duration_ms.toFixed(0)}ms/${t.prompt_eval_count}tok`).join(' · ');
    const modeBit = finalData.used_map_reduce ? `map-reduce · ${finalData.chunks_mapped} chunks` : 'single chunk';
    const adaptiveBit = finalData.adaptive_decision
      ? ` · adaptive: swap ${finalData.adaptive_decision.predicted_swap_ms.toFixed(0)}ms vs raw ${finalData.adaptive_decision.predicted_raw_ms.toFixed(0)}ms → chose ${finalData.adaptive_decision.chose_swap ? 'swap' : 'raw'}`
      : '';
    const sourceFilesBit = (finalData.source_files && finalData.source_files.length)
      ? `<div class="meta">from: ${finalData.source_files.map(escapeHtml).join(', ')}</div>`
      : '';
    const sourcesBit = (finalData.sources && finalData.sources.length)
      ? `<details class="sources"><summary>${finalData.sources.length} contributing chunk${finalData.sources.length === 1 ? '' : 's'}</summary>${
          finalData.sources.map(s => `<div class="source-excerpt"><span class="badge">chunk ${s.chunk_index}</span>${escapeHtml(s.excerpt)}</div>`).join('')
        }</details>`
      : '';
    const metaWrap = document.createElement('div');
    metaWrap.innerHTML = `<div class="meta"><span class="badge">${modeBit}</span>${metaBits}${adaptiveBit}</div>${sourceFilesBit}${sourcesBit}`;
    turn.appendChild(metaWrap);
    // Real streamed fragments should already add up to this exactly -
    // reconciling here is just a safety net against any boundary quirk.
    answerDiv.textContent = finalData.answer;
    questionInput.value = '';
  } catch (e) {
    stopTokenProgressPolling();
    setStatus(askStatus, 'Request failed: ' + e, 'error');
    turn.remove();
  } finally {
    askBtn.disabled = false;
    questionInput.disabled = false;
    questionInput.focus();
  }
}

function escapeHtml(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

async function refreshModelInfo() {
  try {
    const resp = await fetch('/model-info');
    const d = await resp.json();
    if (!d.ok) {
      modelInfo.textContent = d.error || 'model info unavailable';
      return;
    }
    modelInfo.textContent = `model: ${d.model} · mode: ${d.mode} · context window: ${d.context_length.toLocaleString()} tokens · cache: ${d.cache_path}`;
    modelSelect.value = d.model;
    modeSelect.value = d.mode;
    showRamOffloadBadge(d.ram_offload_warning);
    if (d.vram) {
      currentVram = d.vram;
      contextSlider.min = 1024;
      contextSlider.max = currentVram.nominal_context_length;
      contextSlider.step = Math.max(256, Math.round(currentVram.nominal_context_length / 200));
      contextSlider.value = d.context_length;
      renderVramEstimate();
    }
  } catch (e) {
    modelInfo.textContent = 'model info unavailable: ' + e;
  }
}

async function loadModelList() {
  try {
    const resp = await fetch('/models');
    const data = await resp.json();
    if (!data.ok) {
      setStatus(switchStatus, data.error || 'Failed to list models.', 'error');
      return;
    }
    modelSelect.innerHTML = '';
    for (const name of data.models) {
      const opt = document.createElement('option');
      opt.value = name;
      opt.textContent = name;
      modelSelect.appendChild(opt);
    }
  } catch (e) {
    setStatus(switchStatus, 'Request failed: ' + e, 'error');
  }
}

async function switchModel() {
  const model = modelSelect.value;
  const mode = modeSelect.value;
  const context_length = parseInt(contextSlider.value, 10);
  if (!model) {
    setStatus(switchStatus, 'Choose a model first.', 'error');
    return;
  }
  switchBtn.disabled = true;
  setStatus(switchStatus, 'Switching…', null);
  try {
    const resp = await fetch('/model', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ model, mode, context_length }),
    });
    const data = await resp.json();
    if (!data.ok) {
      setStatus(switchStatus, data.error || 'Failed to switch.', 'error');
      return;
    }
    setStatus(switchStatus, `Now using ${data.model} (${data.mode}, ${data.context_length.toLocaleString()} tokens). Load your document(s) again.`, 'ok');
    // Switching models replaces the session - whatever was loaded before
    // is gone, so hide the Q&A section until something is loaded again.
    qaSection.classList.remove('visible');
    transcript.innerHTML = '';
    await refreshModelInfo();
  } catch (e) {
    setStatus(switchStatus, 'Request failed: ' + e, 'error');
  } finally {
    switchBtn.disabled = false;
  }
}

loadBtn.addEventListener('click', loadDocument);
askBtn.addEventListener('click', askQuestion);
switchBtn.addEventListener('click', switchModel);
questionInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') askQuestion(); });
contextSlider.addEventListener('input', renderVramEstimate);
modelSelect.addEventListener('change', () => fetchContextEstimateFor(modelSelect.value));

// Persisted, named document workspaces - a thin save/reload layer over
// /load, not a new upload mechanism (see docuzent#38). Loading a saved
// workspace reuses the on-disk cache for real when it's still there.
async function refreshWorkspaceList() {
  try {
    const resp = await fetch('/workspaces');
    const data = await resp.json();
    if (!data.ok) return;
    const names = Object.keys(data.workspaces).sort();
    workspaceSelect.innerHTML = '<option value="">— none saved —</option>' + names.map(n => `<option value="${escapeHtml(n)}">${escapeHtml(n)}</option>`).join('');
  } catch (e) { /* non-critical - the list just won't refresh this time */ }
}

async function saveWorkspace() {
  const name = workspaceNameInput.value.trim();
  if (!name) {
    setStatus(workspaceStatus, 'Name the workspace first.', 'error');
    return;
  }
  saveWorkspaceBtn.disabled = true;
  try {
    const resp = await fetch('/workspaces', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name }),
    });
    const data = await resp.json();
    if (!data.ok) {
      setStatus(workspaceStatus, data.error || 'Failed to save.', 'error');
      return;
    }
    setStatus(workspaceStatus, `Saved "${name}".`, 'ok');
    workspaceNameInput.value = '';
    await refreshWorkspaceList();
    workspaceSelect.value = name;
  } catch (e) {
    setStatus(workspaceStatus, 'Request failed: ' + e, 'error');
  } finally {
    saveWorkspaceBtn.disabled = false;
  }
}

async function loadWorkspace() {
  const name = workspaceSelect.value;
  if (!name) {
    setStatus(workspaceStatus, 'Pick a saved workspace first.', 'error');
    return;
  }
  loadWorkspaceBtn.disabled = true;
  setStatus(workspaceStatus, `Loading "${name}"…`, null);
  try {
    const resp = await fetch('/workspaces/load', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name }),
    });
    const data = await resp.json();
    if (!data.ok) {
      setStatus(workspaceStatus, data.error || 'Failed to load.', 'error');
      return;
    }
    setStatus(workspaceStatus, `Loaded "${name}" - ${data.chars.toLocaleString()} chars, ${data.warm_from_disk ? 'a cached context is available on disk' : 'cold, not seen before'}.`, 'ok');
    qaSection.classList.add('visible');
    transcript.innerHTML = '';
    questionInput.focus();
  } catch (e) {
    setStatus(workspaceStatus, 'Request failed: ' + e, 'error');
  } finally {
    loadWorkspaceBtn.disabled = false;
  }
}

async function deleteWorkspace() {
  const name = workspaceSelect.value;
  if (!name) {
    setStatus(workspaceStatus, 'Pick a saved workspace first.', 'error');
    return;
  }
  deleteWorkspaceBtn.disabled = true;
  try {
    const resp = await fetch('/workspaces/delete', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name }),
    });
    const data = await resp.json();
    if (!data.ok) {
      setStatus(workspaceStatus, data.error || 'Failed to delete.', 'error');
      return;
    }
    setStatus(workspaceStatus, `Deleted "${name}".`, 'ok');
    await refreshWorkspaceList();
  } catch (e) {
    setStatus(workspaceStatus, 'Request failed: ' + e, 'error');
  } finally {
    deleteWorkspaceBtn.disabled = false;
  }
}

saveWorkspaceBtn.addEventListener('click', saveWorkspace);
loadWorkspaceBtn.addEventListener('click', loadWorkspace);
deleteWorkspaceBtn.addEventListener('click', deleteWorkspace);

loadModelList().then(refreshModelInfo);
refreshWorkspaceList();
</script>
</body>
</html>

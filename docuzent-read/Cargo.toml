[package]
name = "docuzent-read"
version = "0.2.0"
edition = "2021"
description = "Reading a document for a question, four ways: RAG, expanded RAG, RAG pointing at saved KV parts, and saved KV parts only - with the index they use."

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
docuzent-llm = { path = "../docuzent-llm" }
docuzent-kv = { path = "../docuzent-kv" }
docuzent-doc = { path = "../docuzent-doc" }

[package]
name = "docuzent-core"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
redb = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }
sha2 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }
kvcache = { git = "https://github.com/no-mans-code/kvcache" }
